paths:
  /api/products:
    get:
      summary: Listar productos disponibles
      description: |
        Devuelve el catálogo que se puede vender: solo los productos con stock (`status = available`),
        del más nuevo al más viejo. Los productos sin stock no aparecen.
        La respuesta está paginada (`page` y `limit`, 10 por defecto y 100 como máximo).
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        "200":
          description: Página de productos disponibles (vacía si no hay ninguno con stock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        "400":
          $ref: '#/components/responses/InvalidQueryParam'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      summary: Crear un producto
      description: |
        Agrega un producto al catálogo. El `code` tiene que ser único.
        El `status` no se manda: lo calcula la API según el stock (`available` si hay, `out_of_stock` si es 0).
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductInput'
                - required: [title, description, code, price, stock, category]
      responses:
        "201":
          description: Producto creado, con su `status` calculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          $ref: '#/components/responses/InvalidData'
        "409":
          $ref: '#/components/responses/DuplicateProductCode'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Obtener un producto por ID
      description: |
        Devuelve el detalle de un producto (título, descripción, código, precio, stock y categoría) siempre que tenga stock.
        Si el producto existe pero está agotado, responde 404 con `PRODUCT_OUT_OF_STOCK` para que no se pueda vender.
      tags: [Products]
      responses:
        "200":
          description: Producto encontrado y con stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          $ref: '#/components/responses/InvalidId'
        "404":
          $ref: '#/components/responses/ProductUnavailable'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      summary: Actualizar un producto
      description: |
        Modifica un producto, tenga o no stock. Se pueden mandar solo los campos a cambiar.
        Si cambia el stock, se recalcula el `status`: por ejemplo, `{ "stock": 0 }` lo saca del catálogo.
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              stock: 0
      responses:
        "200":
          description: Producto actualizado. Devuelve el producto con los cambios aplicados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          $ref: '#/components/responses/InvalidIdOrData'
        "404":
          $ref: '#/components/responses/ProductNotFound'
        "409":
          $ref: '#/components/responses/DuplicateProductCode'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Eliminar un producto
      description: Borra el producto del catálogo, tenga o no stock. Devuelve el producto eliminado como confirmación.
      tags: [Products]
      responses:
        "200":
          description: Producto eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          $ref: '#/components/responses/InvalidId'
        "404":
          $ref: '#/components/responses/ProductNotFound'
        "500":
          $ref: '#/components/responses/InternalError'

components:
  responses:
    ProductNotFound:
      description: El producto no existe (`PRODUCT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 404
            error: PRODUCT_NOT_FOUND
            message: No se encontró el producto solicitado
    ProductUnavailable:
      description: El producto no existe (`PRODUCT_NOT_FOUND`) o existe pero no tiene stock (`PRODUCT_OUT_OF_STOCK`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noExiste:
              summary: No existe
              value:
                status: error
                statusCode: 404
                error: PRODUCT_NOT_FOUND
                message: No se encontró el producto solicitado
            sinStock:
              summary: Sin stock
              value:
                status: error
                statusCode: 404
                error: PRODUCT_OUT_OF_STOCK
                message: El producto solicitado no tiene stock
    DuplicateProductCode:
      description: Ya existe un producto con ese `code` (`DUPLICATE_VALUE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 409
            error: DUPLICATE_VALUE
            message: Ya existe un registro con ese valor
            details: 'Campos: code'

paths:
  /api/deliveries:
    get:
      summary: Listar entregas
      description: |
        Devuelve las entregas con su estado y prioridad, de la más nueva a la más vieja.
        La respuesta está paginada (`page` y `limit`, 10 por defecto y 100 como máximo) y se puede filtrar por `status`.
        Cada una trae el pedido (estado y total) y el repartidor (nombre y rol) populados; las pendientes no tienen repartidor.
      tags: [Deliveries]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          required: false
          description: Filtra por estado de la entrega
          schema:
            type: string
            enum: [pending, assigned, picked_up, in_transit, delivered, cancelled]
      responses:
        "200":
          description: Página de entregas (vacía si no hay ninguna)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        "400":
          $ref: '#/components/responses/InvalidQueryParam'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      summary: Crear una entrega
      description: |
        Genera la entrega de un pedido existente. Con `driver` la entrega queda `assigned`; sin `driver` queda `pending`
        hasta que se le asigne uno. El repartidor tiene que tener rol `driver` y estar disponible.
        La prioridad se copia del pedido. En la respuesta `order` y `driver` vienen como IDs.
      tags: [Deliveries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: string
                  description: ID de un pedido existente
                  example: 665f4d0a8f9a1b001234abcd
                driver:
                  type: string
                  description: ID de un usuario con rol `driver` y disponible (opcional)
                  example: 665f4d0a8f9a1b001234abd0
      responses:
        "201":
          description: Entrega creada (`assigned` o `pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          $ref: '#/components/responses/InvalidDeliveryData'
        "404":
          $ref: '#/components/responses/DeliveryRelationNotFound'
        "409":
          $ref: '#/components/responses/DriverNotAvailable'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/deliveries/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Obtener una entrega por ID
      description: |
        Devuelve el detalle de una entrega: estado, prioridad, el pedido populado (estado y total)
        y el repartidor asignado (nombre y rol), si ya tiene uno. Sirve para seguir quién lleva un pedido y en qué etapa está.
      tags: [Deliveries]
      responses:
        "200":
          description: Entrega encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          $ref: '#/components/responses/InvalidId'
        "404":
          $ref: '#/components/responses/DeliveryNotFound'
        "500":
          $ref: '#/components/responses/InternalError'

components:
  responses:
    DeliveryNotFound:
      description: La entrega no existe (`DELIVERY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 404
            error: DELIVERY_NOT_FOUND
            message: No se encontró la entrega solicitada
    InvalidDeliveryData:
      description: Falta `order` (`VALIDATION_ERROR`), `order` o `driver` con formato inválido (`INVALID_ID`) o body que no es JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sinPedido:
              summary: Falta el pedido
              value:
                status: error
                statusCode: 400
                error: VALIDATION_ERROR
                message: El campo "order" es obligatorio
            idInvalido:
              summary: ID con formato inválido
              value:
                status: error
                statusCode: 400
                error: INVALID_ID
                message: El ID enviado no tiene un formato válido
                details: 'Valor recibido en "_id": 123'
    DeliveryRelationNotFound:
      description: El pedido no existe (`ORDER_NOT_FOUND`) o el repartidor no existe o no tiene rol `driver` (`DRIVER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pedidoInexistente:
              summary: El pedido no existe
              value:
                status: error
                statusCode: 404
                error: ORDER_NOT_FOUND
                message: El pedido de la entrega no existe
            repartidorInexistente:
              summary: El repartidor no existe
              value:
                status: error
                statusCode: 404
                error: DRIVER_NOT_FOUND
                message: El repartidor no existe o no tiene rol de repartidor
    DriverNotAvailable:
      description: El repartidor no está disponible (`DRIVER_NOT_AVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 409
            error: DRIVER_NOT_AVAILABLE
            message: El repartidor no está disponible para tomar una nueva entrega

paths:
  /api/deliveries:
    get:
      summary: Listar entregas
      description: |
        Devuelve las entregas con su estado y prioridad, de la más nueva a la más vieja.
        La respuesta está paginada (`page` y `limit`, 10 por defecto y 100 como máximo) y se puede filtrar por `status`.
        Cada una trae el pedido (estado y total) y el repartidor (nombre y rol) populados; las pendientes no tienen repartidor.
      tags: [Deliveries]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          required: false
          description: Filtra por estado de la entrega
          schema:
            type: string
            enum: [pending, assigned, picked_up, in_transit, delivered, cancelled]
      responses:
        "200":
          description: Página de entregas (vacía si no hay ninguna)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        "400":
          $ref: '#/components/responses/InvalidQueryParam'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      summary: Crear una entrega
      description: |
        Genera la entrega de un pedido existente. Con `driver` la entrega queda `assigned`; sin `driver` queda `pending`
        hasta que se le asigne uno. El repartidor tiene que tener rol `driver` y estar disponible.
        La prioridad se copia del pedido. En la respuesta `order` y `driver` vienen como IDs.
      tags: [Deliveries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: string
                  description: ID de un pedido existente
                  example: 665f4d0a8f9a1b001234abcd
                driver:
                  type: string
                  description: ID de un usuario con rol `driver` y disponible (opcional)
                  example: 665f4d0a8f9a1b001234abd0
      responses:
        "201":
          description: Entrega creada (`assigned` o `pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          $ref: '#/components/responses/InvalidDeliveryData'
        "404":
          $ref: '#/components/responses/DeliveryRelationNotFound'
        "409":
          $ref: '#/components/responses/DriverNotAvailable'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/deliveries/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Obtener una entrega por ID
      description: |
        Devuelve el detalle de una entrega: estado, prioridad, el pedido populado (estado y total)
        y el repartidor asignado (nombre y rol), si ya tiene uno. Sirve para seguir quién lleva un pedido y en qué etapa está.
      tags: [Deliveries]
      responses:
        "200":
          description: Entrega encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          $ref: '#/components/responses/InvalidId'
        "404":
          $ref: '#/components/responses/DeliveryNotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/deliveries/{id}/status:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      summary: "Tracking: cambiar el estado de una entrega"
      description: |
        Avanza el envío: `pending`, `assigned`, `picked_up`, `in_transit`, `delivered` o `cancelled`.
        Cada cambio se suma a `history` con su fecha, y el pedido de la entrega pasa al estado equivalente
        (`pending` → `created`, el resto con el mismo nombre). Para pasar a un estado que no sea `pending` o `cancelled`
        la entrega necesita repartidor: si todavía no tiene, se manda `driver` (con rol `driver` y disponible).
        Una entrega `delivered` o `cancelled` queda cerrada, y tampoco se puede mover si su pedido ya está cerrado.
      tags: [Deliveries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, assigned, picked_up, in_transit, delivered, cancelled]
                  example: in_transit
                driver:
                  type: string
                  description: ID de un repartidor disponible (opcional; reemplaza al actual)
                  example: 665f4d0a8f9a1b001234abd0
      responses:
        "200":
          description: Estado actualizado. Devuelve la entrega con el pedido y el repartidor populados y el historial completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          $ref: '#/components/responses/InvalidDeliveryStatus'
        "404":
          $ref: '#/components/responses/DeliveryOrDriverNotFound'
        "409":
          $ref: '#/components/responses/DeliveryStatusConflict'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "500":
          $ref: '#/components/responses/InternalError'

components:
  responses:
    DeliveryNotFound:
      description: La entrega no existe (`DELIVERY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 404
            error: DELIVERY_NOT_FOUND
            message: No se encontró la entrega solicitada
    InvalidDeliveryData:
      description: Falta `order` (`VALIDATION_ERROR`), `order` o `driver` con formato inválido (`INVALID_ID`) o body que no es JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sinPedido:
              summary: Falta el pedido
              value:
                status: error
                statusCode: 400
                error: VALIDATION_ERROR
                message: El campo "order" es obligatorio
            idInvalido:
              summary: ID con formato inválido
              value:
                status: error
                statusCode: 400
                error: INVALID_ID
                message: El ID enviado no tiene un formato válido
                details: 'Valor recibido en "_id": 123'
    DeliveryRelationNotFound:
      description: El pedido no existe (`ORDER_NOT_FOUND`) o el repartidor no existe o no tiene rol `driver` (`DRIVER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pedidoInexistente:
              summary: El pedido no existe
              value:
                status: error
                statusCode: 404
                error: ORDER_NOT_FOUND
                message: El pedido de la entrega no existe
            repartidorInexistente:
              summary: El repartidor no existe
              value:
                status: error
                statusCode: 404
                error: DRIVER_NOT_FOUND
                message: El repartidor no existe o no tiene rol de repartidor
    DriverNotAvailable:
      description: El repartidor no está disponible (`DRIVER_NOT_AVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 409
            error: DRIVER_NOT_AVAILABLE
            message: El repartidor no está disponible para tomar una nueva entrega
    InvalidDeliveryStatus:
      description: |
        Estado inexistente o faltante (`INVALID_DELIVERY_STATUS`), falta el repartidor para ese estado (`DRIVER_REQUIRED`),
        ID con formato inválido (`INVALID_ID`) o body que no es JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            estadoInvalido:
              summary: El estado no existe
              value:
                status: error
                statusCode: 400
                error: INVALID_DELIVERY_STATUS
                message: El estado indicado no es válido para una entrega
                details: 'Estados válidos: pending, assigned, picked_up, in_transit, delivered, cancelled'
            sinRepartidor:
              summary: Falta el repartidor
              value:
                status: error
                statusCode: 400
                error: DRIVER_REQUIRED
                message: La entrega necesita un repartidor para pasar a ese estado
                details: 'Para pasar a "in_transit" mandá "driver" en el body'
    DeliveryOrDriverNotFound:
      description: La entrega no existe (`DELIVERY_NOT_FOUND`) o el repartidor no existe o no tiene rol `driver` (`DRIVER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            entregaInexistente:
              summary: La entrega no existe
              value:
                status: error
                statusCode: 404
                error: DELIVERY_NOT_FOUND
                message: No se encontró la entrega solicitada
            repartidorInexistente:
              summary: El repartidor no existe
              value:
                status: error
                statusCode: 404
                error: DRIVER_NOT_FOUND
                message: El repartidor no existe o no tiene rol de repartidor
    DeliveryStatusConflict:
      description: |
        La entrega ya está cerrada (`DELIVERY_ALREADY_CLOSED`), su pedido ya está cerrado (`ORDER_ALREADY_CLOSED`)
        o el repartidor no está disponible (`DRIVER_NOT_AVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            entregaCerrada:
              summary: La entrega ya está cerrada
              value:
                status: error
                statusCode: 409
                error: DELIVERY_ALREADY_CLOSED
                message: La entrega ya fue completada o cancelada y no puede cambiar de estado
                details: 'Estado actual: delivered'
            pedidoCerrado:
              summary: El pedido ya está cerrado
              value:
                status: error
                statusCode: 409
                error: ORDER_ALREADY_CLOSED
                message: El pedido ya fue entregado o cancelado y no puede cambiar de estado
                details: 'Estado actual del pedido: cancelled'

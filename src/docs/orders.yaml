paths:
  /api/orders:
    get:
      summary: Listar pedidos
      description: Cada pedido trae el cliente populado (nombre, apellido y email).
      tags: [Orders]
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      summary: Crear un pedido
      description: |
        El `total` lo calcula la API con los items. El pedido arranca en estado `created`.
        En la respuesta `customer` viene como ID (sin popular).
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, items, deliveryAddress]
              properties:
                customer:
                  type: string
                  description: ID de un usuario existente
                  example: 665f4d0a8f9a1b001234abce
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderItem'
                deliveryAddress:
                  type: string
                  example: Av. Siempre Viva 742
                priority:
                  type: string
                  enum: [low, normal, high]
                  default: normal
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      payload:
                        $ref: '#/components/schemas/Order'
        "400":
          description: |
            Sin items (`ORDER_ITEMS_REQUIRED`), `customer` con formato inválido (`INVALID_ID`),
            falta `deliveryAddress`, un item está mal o la prioridad no existe (`VALIDATION_ERROR`),
            o el body no es JSON (`INVALID_JSON`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sinItems:
                  summary: Sin items
                  value:
                    status: error
                    statusCode: 400
                    error: ORDER_ITEMS_REQUIRED
                    message: El pedido debe incluir al menos un item
                sinDireccion:
                  summary: Falta la dirección
                  value:
                    status: error
                    statusCode: 400
                    error: VALIDATION_ERROR
                    message: El campo "deliveryAddress" es obligatorio
        "404":
          description: Falta `customer` o el usuario no existe (`USER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: USER_NOT_FOUND
                message: No se encontró el usuario indicado para crear el pedido
        "500":
          $ref: '#/components/responses/InternalError'

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Obtener un pedido por ID
      tags: [Orders]
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      payload:
                        $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/InvalidId'
        "404":
          $ref: '#/components/responses/OrderNotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      summary: Cambiar el estado de un pedido
      description: Un pedido entregado (`delivered`) o cancelado (`cancelled`) ya no puede cambiar de estado.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
                  example: in_transit
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      payload:
                        $ref: '#/components/schemas/Order'
        "400":
          description: Estado inexistente o faltante (`INVALID_ORDER_STATUS`), ID inválido (`INVALID_ID`) o body que no es JSON (`INVALID_JSON`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 400
                error: INVALID_ORDER_STATUS
                message: El estado indicado no es válido para un pedido
                details: 'Estados válidos: created, assigned, picked_up, in_transit, delivered, cancelled'
        "404":
          $ref: '#/components/responses/OrderNotFound'
        "409":
          description: El pedido ya está cerrado (`ORDER_ALREADY_CLOSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 409
                error: ORDER_ALREADY_CLOSED
                message: El pedido ya fue entregado o cancelado y no puede cambiar de estado
                details: 'Estado actual: delivered'
        "500":
          $ref: '#/components/responses/InternalError'

components:
  responses:
    OrderNotFound:
      description: El pedido no existe (`ORDER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            statusCode: 404
            error: ORDER_NOT_FOUND
            message: No se encontró el pedido solicitado
